title: SAM / SYSTEM / SECURITY Hive Dump via reg.exe
id: dd7e2a3d-5a35-4c55-8c08-6b72d11519ef
status: experimental
description: |
  Detects reg.exe saving the SAM, SYSTEM, or SECURITY registry hives to a file. Together these
  hives contain local account password hashes and the key to decrypt them, which attackers
  extract offline (e.g. with secretsdump).
references:
  - https://attack.mitre.org/techniques/T1003/002/
author: DetectLedger
date: 2026-11-10
tags:
  - attack.credential_access
  - attack.t1003.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    - Image|endswith: '\reg.exe'
    - OriginalFileName: 'reg.exe'
  selection_action:
    CommandLine|contains:
      - ' save '
      - ' export '
  selection_hive:
    # Full hive paths: a bare '\system' would also match '...\system32\reg.exe' itself
    CommandLine|contains:
      - 'hklm\sam'
      - 'hklm\system'
      - 'hklm\security'
      - 'hkey_local_machine\sam'
      - 'hkey_local_machine\system'
      - 'hkey_local_machine\security'
  condition: all of selection_*
falsepositives:
  - Some backup or imaging scripts export hives; verify the parent process and output location
level: high
