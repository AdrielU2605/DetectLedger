title: Remote Process Creation via WMIC
id: 842cd0bc-08a1-4f95-92bd-cdbbddc4dc24
status: experimental
description: |
  Detects 'wmic /node:<host> process call create', which starts a process on another machine
  over WMI. It is a classic lateral movement method because WMI is enabled almost everywhere and
  leaves no new service or file behind. On the target, the process appears as a child of WmiPrvSE.exe.
references:
  - https://attack.mitre.org/techniques/T1047/
author: DetectLedger
date: 2026-11-10
tags:
  - attack.execution
  - attack.lateral_movement
  - attack.t1047
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    - Image|endswith: '\wmic.exe'
    - OriginalFileName: 'wmic.exe'
  selection_cmd:
    CommandLine|contains|all:
      - '/node:'
      - 'process'
      - 'call'
      - 'create'
  condition: all of selection_*
falsepositives:
  - Legacy admin scripts that use WMIC for remote management
level: high
